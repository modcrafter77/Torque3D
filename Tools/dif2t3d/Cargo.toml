[package]
name = "dif2t3d"
version = "0.1.0"
edition = "2021"
description = "Convert TGE .dif interiors to Torque3D-ready COLLADA + asset metadata"

[[bin]]
name = "dif2t3d"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dif = { package = "libdif", path = "../../../DIFImporter/io_dif/rust/libdif" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
